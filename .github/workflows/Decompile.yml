name: Decompile Crazy Cattle
on: workflow_dispatch

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Get GDRE Tools
        run: |
          curl -L -o gdre.zip https://github.com/GDRETools/gdsdecomp/releases/latest/download/GDRE_tools-linux.zip
          unzip gdre.zip -d gdre

      - name: Get the APK from Releases
        run: curl -L -o game.apk https://github.com/Max6778/Deltarune/releases/download/Release/CC3Dport-1.4-HiRes.apk

      - name: Recover project
        run: |
          chmod +x gdre/gdre_tools
          ./gdre/gdre_tools --headless --recover=game.apk --output-dir=recovered_project
          # run `./gdre/gdre_tools --help` first if this flag name doesn't match the current release

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered_project
          path: recovered_project/
