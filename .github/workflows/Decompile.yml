name: Decompile game.droid

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**/game.droid'

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone UndertaleModTool (with submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UnderminersTeam/UndertaleModTool.git

      - name: Build UndertaleModCli
        run: dotnet build UndertaleModTool/UndertaleModCli/UndertaleModCli.csproj -c Release -o cli-build

      - name: Find game.droid in assets/
        id: find
        run: |
          FILE=$(find assets -type f -name "game.droid" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No game.droid found under assets/"
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Patch ExportAllCode.csx to skip interactive folder prompt
        run: |
          SCRIPT="UndertaleModTool/UndertaleModTool/Scripts/Resource Exporters/ExportAllCode.csx"
          mkdir -p "$GITHUB_WORKSPACE/decompiled_code"
          # PromptChooseDirectory() opens a GUI folder picker / reads stdin - neither
          # works in a headless runner, so replace the call with a fixed path.
          sed -i "s#PromptChooseDirectory()#\"$GITHUB_WORKSPACE/decompiled_code\"#g" "$SCRIPT"
          grep -n "decompiled_code" "$SCRIPT" || { echo "Patch did not apply, check script contents"; exit 1; }

      - name: Decompile code with ExportAllCode.csx
        run: |
          mkdir -p decompiled
          dotnet cli-build/UndertaleModCli.dll load "${{ steps.find.outputs.path }}" \
            -s "UndertaleModTool/UndertaleModTool/Scripts/Resource Exporters/ExportAllCode.csx" \
            -o decompiled/output.droid

      - name: Verify decompiled output exists
        run: |
          if [ -z "$(ls -A decompiled_code 2>/dev/null)" ]; then
            echo "decompiled_code is empty - the script did not export anything"
            exit 1
          fi

      - name: Upload decompiled code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-gml-code
          path: decompiled_code/
