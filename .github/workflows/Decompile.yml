name: Decompile ssh-v1
on: workflow_dispatch

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Get GDRE Tools
        run: |
          URL=$(curl -s https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest \
            | grep browser_download_url | grep -i linux | head -1 | cut -d '"' -f 4)
          echo "Downloading: $URL"
          curl -L -o gdre.zip "$URL"
          unzip gdre.zip -d gdre
          find gdre -type f

      - name: Get the game exe
        run: curl -L -o game.exe https://github.com/Max6778/Deltarune/releases/download/Release/ssh-v1.exe

      - name: Recover project
        run: |
          BIN=$(find gdre -type f -iname "gdre_tools*" ! -iname "*.pck" | head -1)
          chmod +x "$BIN"
          "$BIN" --headless --recover=game.exe --output=recovered_project

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered_project
          path: recovered_project/
