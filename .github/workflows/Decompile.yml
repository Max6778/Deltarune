name: Decompile Crazy Cattle
on: workflow_dispatch

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Get GDRE Tools
        run: |
          curl -L -o gdre.zip https://github.com/Max6778/Deltarune/releases/download/Release/CC3Dport-1.4-HiRes.apk
          unzip gdre.zip -d gdre

      - name: Upload your APK to the runner
        uses: actions/upload-artifact@v4
        # (or add the apk to the repo and checkout instead)

      - name: Recover project
        run: |
          chmod +x gdre/gdre_tools
          ./gdre/gdre_tools --headless --recover=CC3Dport-1_4-HiRes.apk --output-dir=recovered_project
          # check ./gdre/gdre_tools --help if flag names differ in the current release

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered_project
          path: recovered_project/
