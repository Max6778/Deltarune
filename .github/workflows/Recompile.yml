name: Recompile to game.droid

on:
  workflow_dispatch:
    inputs:
      original_droid_path:
        description: 'Path to the original game.droid in assets/ (the one to patch)'
        required: true
        default: 'assets/game.droid'
      gml_source_dir:
        description: 'Folder containing edited .gml files to import'
        required: true
        default: 'decompiled_code'

jobs:
  recompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone UndertaleModTool (with submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UnderminersTeam/UndertaleModTool.git

      - name: Build UndertaleModCli
        run: dotnet build UndertaleModTool/UndertaleModCli/UndertaleModCli.csproj -c Release -o cli-build

      - name: Patch ImportGML.csx to skip interactive folder prompt
        run: |
          SCRIPT="UndertaleModTool/UndertaleModTool/Scripts/Resource Importers/ImportGML.csx"
          IMPORT_PATH="$GITHUB_WORKSPACE/${{ github.event.inputs.gml_source_dir }}"
          sed -i "s#PromptChooseDirectory()#\"$IMPORT_PATH\"#g" "$SCRIPT"
          grep -n "$IMPORT_PATH" "$SCRIPT" || { echo "Patch did not apply, check script contents"; exit 1; }

      - name: Import GML with ImportGML.csx
        run: |
          mkdir -p output
          dotnet cli-build/UndertaleModCli.dll load "${{ github.event.inputs.original_droid_path }}" \
            -s "UndertaleModTool/UndertaleModTool/Scripts/Resource Importers/ImportGML.csx" \
            -o output/game.droid

      - name: Upload patched game.droid
        uses: actions/upload-artifact@v4
        with:
          name: patched-game-droid
          path: output/game.droid
